<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飲食店店長向け研修</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      --bg: #fff8f0;
      --card-bg: #ffffff;
      --primary: #ff8a3d;
      --text: #3f2f25;
      --muted: #7c6c62;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .flyer {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 18px 35px rgba(63, 47, 37, 0.15);
      max-width: 720px;
      overflow: hidden;
    }

    .flyer__image {
      position: relative;
      width: 100%;
      padding-top: 60%;
      overflow: hidden;
    }

    .flyer__image img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .flyer__body {
      padding: 32px;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 138, 61, 0.16);
      color: var(--primary);
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
      letter-spacing: 0.08em;
      font-size: 0.8rem;
    }

    h1 {
      font-size: clamp(1.8rem, 3vw + 1rem, 2.6rem);
      margin: 16px 0 24px;
      line-height: 1.3;
    }

    .description {
      margin-bottom: 28px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .info-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 16px;
    }

    .info-item {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 8px;
      align-items: start;
      font-size: 1.05rem;
    }

    .info-label {
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.8rem;
    }

    .info-value {
      font-weight: 600;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 16px;
      }

      .flyer__body {
        padding: 24px;
      }

      .info-item {
        grid-template-columns: 1fr;
      }

      .info-label {
        order: -1;
      }
    }
  </style>
</head>
<body>
  <main class="flyer">
    <figure class="flyer__image">
      <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1600&q=80" alt="温かい雰囲気のレストラン" />
    </figure>
    <div class="flyer__body">
      <span class="badge">店長向け研修</span>
      <h1>ファンをつくる接客とチームづくり研修</h1>
      <p class="description">
        現場を支える店長のための、とっておきの1日。すぐに現場で活かせる接客のコツから、スタッフが自然とやる気になるチーム運営まで、実践ワークで楽しく学びましょう。
      </p>
      <ul class="info-list">
        <li class="info-item">
          <span class="info-label">開催日時</span>
          <span class="info-value">2024年6月25日（火） 10:00〜17:00</span>
        </li>
        <li class="info-item">
          <span class="info-label">場所</span>
          <span class="info-value">大阪・梅田カンファレンスセンター 5F</span>
        </li>
        <li class="info-item">
          <span class="info-label">参加費</span>
          <span class="info-value">お一人様 12,000円（税込）</span>
        </li>
      </ul>
    </div>
  </main>
</body>
</html>
